{% extends "base.html" %}
{% block title %}Mock inbox{% endblock %}
{% block content %}
<h1>Mock inbox</h1>
<p>Scan up to {{ limit }} fictional messages.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('pages.preview') }}">
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
  <button type="submit">Preview inbox</button>
</form>
{% endblock %}
