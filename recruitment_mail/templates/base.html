<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | Recruitment mail</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="masthead">
    <div class="shell masthead-inner">
      <span class="wordmark">Recruitment mail</span>
      <span class="source{{ ' source-live' if config.GMAIL_MODE else '' }}">{{ "Live Gmail" if config.GMAIL_MODE else "Mock mode" }}</span>
    </div>
  </header>
  <main class="shell">{% block content %}{% endblock %}</main>
</body>
</html>
