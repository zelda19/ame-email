[project]
name = "recruitment-mail"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["Flask"]

[project.optional-dependencies]
test = ["pytest"]
gmail = ["google-api-python-client>=2", "google-auth", "google-auth-httplib2", "google-auth-oauthlib>=1.3"]

[tool.setuptools.packages.find]
include = ["recruitment_mail"]

[tool.setuptools.package-data]
recruitment_mail = ["fixtures/*.json", "templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
